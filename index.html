<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>習慣トラッカー</title>
  <meta name="theme-color" content="#2f6f5e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="習慣">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="config-error" class="card notice" hidden>
    <strong>接続情報が未設定です。</strong>
    <p>config.js に Supabase の Project URL と anon キーを貼り付けてください。</p>
  </div>

  <!-- ログイン -->
  <section id="login-view" class="narrow" hidden>
    <h1 class="brand">習慣トラッカー</h1>
    <form id="login-form" class="card stack">
      <label>メールアドレス<input type="email" name="email" autocomplete="username" required></label>
      <label>パスワード<input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit" class="primary">ログイン</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </section>

  <!-- メイン -->
  <section id="app-view" hidden>
    <header class="topbar">
      <span class="brand">習慣トラッカー</span>
      <button id="logout" class="ghost small">ログアウト</button>
    </header>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="today" aria-selected="true">今日</button>
      <button role="tab" data-tab="manage" aria-selected="false">習慣の管理</button>
    </nav>

    <main class="narrow">
      <!-- 今日タブ -->
      <div id="tab-today">
        <div class="datebar">
          <button id="prev-day" class="ghost" aria-label="前の日">◀</button>
          <div class="date-center">
            <div id="date-label" class="date-label"></div>
            <button id="go-today" class="link small" hidden>今日に戻る</button>
          </div>
          <button id="next-day" class="ghost" aria-label="次の日">▶</button>
        </div>

        <div class="card summary">
          <div>
            <div class="muted small">この日の達成率</div>
            <div id="day-rate" class="big">—</div>
            <div id="day-count" class="muted small"></div>
          </div>
          <div class="week">
            <div class="muted small">直近7日</div>
            <div id="week-bars" class="week-bars"></div>
          </div>
        </div>

        <ul id="habit-checklist" class="checklist"></ul>
        <p id="empty-today" class="muted center" hidden></p>
      </div>

      <!-- 管理タブ -->
      <div id="tab-manage" hidden>
        <form id="habit-form" class="card stack">
          <h2 id="form-title">習慣を追加</h2>
          <label>習慣の名前<input name="habit_name" maxlength="100" required placeholder="例：朝の散歩 15分"></label>
          <label>カテゴリー
            <select name="category" id="category-select"></select>
          </label>
          <fieldset>
            <legend>実施する曜日</legend>
            <div id="weekday-picker" class="weekdays"></div>
          </fieldset>
          <div class="row">
            <button type="submit" class="primary" id="form-submit">追加する</button>
            <button type="button" class="ghost" id="form-cancel" hidden>キャンセル</button>
          </div>
          <p id="form-error" class="error" hidden></p>
        </form>

        <h2 class="section-title">登録中の習慣</h2>
        <ul id="habit-list" class="habit-list"></ul>
        <p id="empty-manage" class="muted center" hidden>まだ習慣がありません。上のフォームから追加してください。</p>
      </div>
    </main>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
